<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Workout Interval Timer</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="./site.webmanifest" />

    <link rel="icon" type="image/png" href="./icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="shortcut icon" href="./icons/favicon.ico" />

    <!-- iOS Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Timer" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="./site.webmanifest" />

</head>
<body>
    <div class="app-container">
        
        <!-- SETUP VIEW -->
        <section id="setup-view" class="view active">
        <header>
            <h1>Workout Setup</h1>
        </header>

        <form id="add-exercise-form" class="card">
            <div class="input-group">
            <input type="text" id="ex-name" placeholder="Exercise (e.g. Pushups)" required />
            <input type="number" id="ex-duration" placeholder="Duration (sec)" min="1" required />
            </div>
            <button type="submit" class="btn btn-primary">+ Add Exercise</button>
        </form>

        <div class="card global-settings">
            <label for="rest-duration">Global Rest Time (seconds):</label>
            <input type="number" id="rest-duration" min="0" value="20" />
        </div>

        <div class="exercise-list-container">
            <h2>Exercises</h2>
            <ul id="exercise-list"></ul>
        </div>

        <button id="start-workout-btn" class="btn btn-accent btn-large">
            <span>Start Workout 🚀</span>
            <span id="start-btn-time" class="btn-subtext">(0s)</span>
        </button>

        <footer class="app-footer">
            <a href="https://www.flaticon.com/free-icons/gym" title="gym icons" target="_blank" rel="noopener noreferrer">
                Icon created by Aldo Cervantes - Flaticon
            </a>
        </section>

    <!-- WORKOUT RUNNER VIEW -->
    <section id="workout-view" class="view">
        <div id="phase-badge" class="badge">WORKOUT</div>
        <h1 id="current-title">Exercise Name</h1>
      
        <div class="timer-container">
            <svg class="progress-ring" width="280" height="280" viewBox="0 0 280 280">
                <circle class="progress-ring__bg" r="120" cx="140" cy="140" />
                <circle id="progress-bar" class="progress-ring__circle" r="120" cx="140" cy="140" />
            </svg>
            <div class="timer-display">
                <span id="timer-countdown">0s</span>
            </div>
        </div>

      <div class="next-up-banner">
        <span>Next: </span><strong id="next-title">Rest</strong>
      </div>

      <div class="controls">
        <button id="pause-btn" class="btn btn-control">Pause</button>
        <button id="skip-btn" class="btn btn-control">Skip ⏭</button>
        <button id="quit-btn" class="btn btn-danger">End Workout</button>
      </div>
    </section>

  </div>
  
  <script src="app.js"></script>
</body>
</html>
